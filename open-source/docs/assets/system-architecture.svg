<text x="80" y="378" class="line">账号 / 注册策略 / 设备配对</text>
<text x="80" y="412" class="line">群聊 / 成员 / 邀请 / 消息 / 附件</text>
<text x="80" y="446" class="line">独立智能体身份 / 会话与历史</text>
<text x="80" y="480" class="line">联系人 / Agent 链接 / 可见性</text>
<text x="80" y="514" class="line">成员权限 / 撤权 / 同步恢复</text>
<rect x="566" y="292" width="468" height="326" rx="18" fill="white" stroke="#d7e0ec"/><rect x="566" y="312" width="5" height="32" rx="2" fill="#0b9983"/>
<text x="590" y="337" class="head">Personal Agent</text>
<text x="590" y="378" class="line">主电脑选择 / 主 Agent 系统设置</text>
<text x="590" y="412" class="line">自己的模型 Key / 默认 Worker</text>
<text x="590" y="446" class="line">后台任务 / 事件 / 执行结果</text>
<text x="590" y="480" class="line">Wiki 与记忆 · 有限索引与授权读取</text>
<text x="590" y="514" class="line">日记 · 主电脑文件与手机副本</text>
<rect x="1076" y="292" width="468" height="326" rx="18" fill="white" stroke="#d7e0ec"/><rect x="1076" y="312" width="5" height="32" rx="2" fill="#b8781b"/>
<text x="1100" y="337" class="head">个人功能与工具</text>
<text x="1100" y="378" class="line">提醒 / 日历 / 笔记</text>
<text x="1100" y="412" class="line">录音 / 聆听 / 可选语音转写</text>
<text x="1100" y="446" class="line">本机文件夹 / 已登记应用</text>
<text x="1100" y="480" class="line">原生 AI 会话 / 能力发现</text>
<text x="1100" y="514" class="line">高影响动作仍需真人授权</text>
