<text x="80" y="711" class="head">自托管 Server · Docker Compose</text>
<text x="80" y="752" class="line">受信 HTTPS / WSS → API / 实时 Relay</text>
<text x="80" y="786" class="line">后台 Worker · 通知与处理协调</text>
<text x="80" y="820" class="line">数据库：账号 / 关系 / 消息 / 元数据</text>
<text x="80" y="854" class="line">Redis：中转与任务　附件：本地或对象存储</text>
<rect x="820" y="666" width="724" height="236" rx="18" fill="white" stroke="#d7e0ec"/><rect x="820" y="686" width="5" height="32" rx="2" fill="#0b9983"/>
<text x="844" y="711" class="head">用户电脑 · Client / Daemon</text>
<text x="844" y="752" class="line">配对 / 权限 / 工具适配 / Personal Agent 执行</text>
<text x="844" y="786" class="line">本地：记忆 / 日记 / 历史 / 工作空间 / 应用</text>
<text x="844" y="820" class="line">受限：设备身份与模型 Key，不回传手机明文</text>
<text x="844" y="854" class="line">每台 Client 独立备份；不等于操作系统沙箱</text>
<path d="M780,784 L818,784" stroke="#7c93b2" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="56" y="940" width="1488" height="112" rx="18" fill="white" stroke="#d7e0ec"/><rect x="56" y="960" width="5" height="32" rx="2" fill="#b8781b"/>
<text x="80" y="985" class="head">可选供应商与部署配置</text>
<text x="80" y="1026" class="line">模型 / ASR / TTS / 短信 / 系统推送按需启用；未配置不静默回退，客户端只接收能力状态</text>
<text x="56" y="1092" class="small">框架功能地图 ≠ 全部验收通过；托管 Pi Agent 的实测不替代内置 Personal Agent 验收。</text>
<text x="56" y="1125" class="small">传输 TLS ≠ 端到端加密。Server 备份不含其他电脑的个人文件。核对：2026-10-24。</text>
</svg>