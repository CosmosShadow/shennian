<text x="56" y="66" class="title">神念 · 开源功能与系统架构</text>
<text x="56" y="104" class="sub">连接人、自己的 AI 与别人的 AI ｜ 一个安装，一台活动 Server</text>
<rect x="56" y="142" width="1488" height="112" rx="18" fill="white" stroke="#d7e0ec"/><rect x="56" y="162" width="5" height="32" rx="2" fill="#536ce8"/>
